<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการหลังบ้าน - ขนำลุงดำ แคมป์ปิ้ง</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Kanit', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // หมายเหตุ: กรุณาใส่ URL ของ Google Apps Script Web App ที่ Deploy เรียบร้อยแล้วตรงนี้
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_REPLACE_WITH_YOUR_GAS_DEPLOYMENT_ID/exec";

    // Helper: แปลงการเรียก API ผ่าน fetch
    async function apiCall(action, payload = {}) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...payload })
        });
        return await response.json();
      } catch (err) {
        console.error("API Call Error:", err);
        return { status: 'error', message: 'ไม่สามารถเชื่อมต่อเครื่องเซิร์ฟเวอร์ได้' };
      }
    }

    // Helper: จัดรูปแบบวันที่ไทย
    function formatThaiDate(dateStr) {
      if (!dateStr || dateStr === '-') return '-';
      const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    // Main App Component
    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // System Data States
      const [activeTab, setActiveTab] = useState('dashboard');
      const [bookings, setBookings] = useState([]);
      const [roomConfig, setRoomConfig] = useState({});
      const [mapConfig, setMapConfig] = useState({});
      const [siteSettings, setSiteSettings] = useState({});
      const [settings, setSettings] = useState({ discounts: [], closed: [], special: [], roomClosures: [] });

      // Filters & Search
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');

      // Modals State
      const [selectedSlipUrl, setSelectedSlipUrl] = useState(null);
      const [activeModal, setActiveModal] = useState(null); // 'walkin', 'addService', 'editRoom', 'reschedule'
      const [selectedBooking, setSelectedBooking] = useState(null);

      // Walk-in / Admin Booking Form State
      const [walkinForm, setWalkinForm] = useState({
        checkIn: '',
        checkOut: '',
        customerName: '',
        customerPhone: '',
        guests: 2,
        selectedRooms: [], // list of roomIds
        foodCart: [],
        depositPaid: 0
      });
      const [walkinAvail, setWalkinAvail] = useState({ bookedRooms: [], roomAvailableCount: {} });
      const [isFetchingAvail, setIsFetchingAvail] = useState(false);
      const [walkinViewMode, setWalkinViewMode] = useState('map'); // 'map' or 'list'

      // Room Settings Form State
      const [editingRoom, setEditingRoom] = useState(null);
      const [roomForm, setRoomForm] = useState({
        oldId: '',
        id: '',
        name: '',
        type: 'บ้านพัก',
        min: 1,
        maxCap: 2,
        pricing: { tiers: [{ max: 2, price: 1000 }], priceHead: 150 },
        bf: 'ไม่มี'
      });

      // Add Service Form
      const [serviceForm, setServiceForm] = useState({ name: '', price: 0, qty: 1, status: 'paid' });

      // Check Login Session
      useEffect(() => {
        const savedPass = localStorage.getItem('kl_admin_pass');
        if (savedPass) {
          verifyLogin(savedPass);
        }
      }, []);

      // Verify Login
      const verifyLogin = async (pass) => {
        setIsLoading(true);
        setLoginError('');
        const res = await apiCall('adminLogin', { password: pass });
        if (res.status === 'success') {
          setIsAuthenticated(true);
          setAdminPassword(pass);
          localStorage.setItem('kl_admin_pass', pass);
          loadAllData(pass);
        } else {
          setLoginError(res.message || 'รหัสผ่านไม่ถูกต้อง');
          localStorage.removeItem('kl_admin_pass');
        }
        setIsLoading(false);
      };

      // Load System Data
      const loadAllData = async (pass) => {
        setIsLoading(true);
        const [adminRes, initRes] = await Promise.all([
          apiCall('getAdminData', { password: pass }),
          apiCall('getInitialData')
        ]);

        if (adminRes.status === 'success') setBookings(adminRes.data || []);
        if (initRes.status === 'success' && initRes.data) {
          setRoomConfig(initRes.data.roomConfig || {});
          setMapConfig(initRes.data.mapConfig || {});
          setSiteSettings(initRes.data.siteConfig || {});
          setSettings(initRes.data.settings || { discounts: [], closed: [], special: [], roomClosures: [] });
        }
        setIsLoading(false);
      };

      // Real-time Availability Check for Walk-in Booking
      useEffect(() => {
        if (walkinForm.checkIn && walkinForm.checkOut) {
          fetchWalkinAvailability(walkinForm.checkIn, walkinForm.checkOut);
        }
      }, [walkinForm.checkIn, walkinForm.checkOut]);

      const fetchWalkinAvailability = async (cIn, cOut) => {
        setIsFetchingAvail(true);
        try {
          const res = await fetch(`${SCRIPT_URL}?action=getAvailability&checkIn=${cIn}&checkOut=${cOut}`);
          const data = await res.json();
          if (data.status === 'success') {
            setWalkinAvail({
              bookedRooms: data.bookedRooms || [],
              roomAvailableCount: data.roomAvailableCount || {}
            });
          }
        } catch (e) {
          console.error(e);
        }
        setIsFetchingAvail(false);
      };

      // Handle Room Selection in Walkin
      const toggleWalkinRoom = (roomId) => {
        const isBooked = walkinAvail.bookedRooms.includes(roomId) || (walkinAvail.roomAvailableCount[roomId] <= 0);
        if (isBooked) {
          alert('ห้องพักนี้ถูกจองแล้ว หรือไม่ว่างในช่วงวันที่เลือก!');
          return;
        }

        setWalkinForm(prev => {
          const exists = prev.selectedRooms.includes(roomId);
          if (exists) {
            return { ...prev, selectedRooms: prev.selectedRooms.filter(id => id !== roomId) };
          } else {
            return { ...prev, selectedRooms: [...prev.selectedRooms, roomId] };
          }
        });
      };

      // Calculate Walkin Price
      const walkinPricing = useMemo(() => {
        if (!walkinForm.checkIn || !walkinForm.checkOut) return { total: 0, nights: 1 };
        const d1 = new Date(walkinForm.checkIn);
        const d2 = new Date(walkinForm.checkOut);
        const nights = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)));
        
        let total = 0;
        walkinForm.selectedRooms.forEach(rId => {
          const room = roomConfig[rId];
          if (room) {
            const isTent = rId === 'Z8' || rId === 'R6528' || (room.type || '').includes('เต็นท์') || (room.name || '').includes('ลานกาง');
            if (isTent) {
              const headPrice = room.pricing?.priceHead || 150;
              total += (headPrice * walkinForm.guests * nights);
            } else {
              let nightPrice = 1000;
              if (room.pricing?.tiers) {
                const tier = room.pricing.tiers.find(t => walkinForm.guests <= t.max) || room.pricing.tiers[room.pricing.tiers.length - 1];
                nightPrice = tier ? tier.price : 1000;
              }
              total += (nightPrice * nights);
            }
          }
        });

        return { total, nights };
      }, [walkinForm.checkIn, walkinForm.checkOut, walkinForm.selectedRooms, walkinForm.guests, roomConfig]);

      // Submit Admin Walk-in Booking
      const handleSaveWalkin = async () => {
        if (!walkinForm.checkIn || !walkinForm.checkOut) return alert('กรุณาระบุวันเข้าพักและเช็คเอาท์');
        if (!walkinForm.customerName || !walkinForm.customerPhone) return alert('กรุณากรอกชื่อและเบอร์โทรศัพท์ลูกค้า');
        if (walkinForm.selectedRooms.length === 0) return alert('กรุณาเลือกอย่างน้อย 1 ห้องพัก');

        setIsLoading(true);
        const cart = walkinForm.selectedRooms.map(rId => {
          const r = roomConfig[rId];
          return {
            id: rId,
            name: r ? r.name : rId,
            type: r ? r.type : 'ห้องพัก',
            guests: walkinForm.guests,
            price: 0
          };
        });

        const payload = {
          password: adminPassword,
          checkIn: walkinForm.checkIn,
          checkOut: walkinForm.checkOut,
          totalGuests: walkinForm.guests,
          customer: { name: walkinForm.customerName, phone: walkinForm.customerPhone },
          cart: cart,
          price: walkinPricing.total,
          deposit: walkinForm.depositPaid || walkinPricing.total
        };

        const res = await apiCall('createAdminBooking', payload);
        if (res.status === 'success') {
          alert('บันทึกการจอง Walk-in สำเร็จ! รหัสการจอง: ' + res.bookingId);
          setActiveModal(null);
          loadAllData(adminPassword);
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
        setIsLoading(false);
      };

      // Save/Update Room Configuration (Allows editing Room ID)
      const handleSaveRoomConfig = async () => {
        if (!roomForm.id || !roomForm.name) return alert('กรุณากรอกรหัสห้องและชื่อห้องพัก');

        const updatedRooms = { ...roomConfig };
        const updatedMap = { ...mapConfig };

        // ถ้ามีการเปลี่ยนรหัสห้อง (Room ID) ให้ลบ ID เดิมออก
        if (roomForm.oldId && roomForm.oldId !== roomForm.id) {
          delete updatedRooms[roomForm.oldId];
          if (updatedMap[roomForm.oldId]) {
            updatedMap[roomForm.id] = updatedMap[roomForm.oldId];
            delete updatedMap[roomForm.oldId];
          }
        }

        updatedRooms[roomForm.id] = {
          id: roomForm.id,
          name: roomForm.name,
          type: roomForm.type,
          min: roomForm.min,
          maxCap: roomForm.maxCap,
          pricing: roomForm.pricing,
          bf: roomForm.bf
        };

        if (!updatedMap[roomForm.id]) {
          updatedMap[roomForm.id] = { x: 50, y: 50 }; // Default center position
        }

        setIsLoading(true);
        const roomsList = Object.values(updatedRooms);
        const res = await apiCall('saveRoomSystem', {
          password: adminPassword,
          rooms: roomsList,
          mapConfig: updatedMap,
          siteSettings: siteSettings
        });

        if (res.status === 'success') {
          alert('บันทึกข้อมูลห้องพักเรียบร้อยแล้ว');
          setRoomConfig(updatedRooms);
          setMapConfig(updatedMap);
          setActiveModal(null);
        } else {
          alert('ไม่สามารถบันทึกข้อมูลได้: ' + res.message);
        }
        setIsLoading(false);
      };

      // Delete Room
      const handleDeleteRoom = async (roomId) => {
        if (!confirm(`คุณต้องการลบห้องพัก [${roomId}] ใช่หรือไม่?`)) return;
        const updatedRooms = { ...roomConfig };
        const updatedMap = { ...mapConfig };
        delete updatedRooms[roomId];
        delete updatedMap[roomId];

        setIsLoading(true);
        const res = await apiCall('saveRoomSystem', {
          password: adminPassword,
          rooms: Object.values(updatedRooms),
          mapConfig: updatedMap,
          siteSettings: siteSettings
        });
        if (res.status === 'success') {
          setRoomConfig(updatedRooms);
          setMapConfig(updatedMap);
          alert('ลบห้องพักเรียบร้อยแล้ว');
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
        setIsLoading(false);
      };

      // Update Booking Status
      const handleUpdateStatus = async (bookingId, newStatus) => {
        setIsLoading(true);
        const res = await apiCall('updateStatus', {
          password: adminPassword,
          bookingId: bookingId,
          newStatus: newStatus
        });
        if (res.status === 'success') {
          setBookings(prev => prev.map(b => b.id === bookingId ? { ...b, status: newStatus } : b));
        } else {
          alert('อัปเดตสถานะไม่สำเร็จ: ' + res.message);
        }
        setIsLoading(false);
      };

      // Admin Add Service
      const handleAddServiceSubmit = async () => {
        if (!serviceForm.name || serviceForm.price <= 0) return alert('กรุณากรอกข้อมูลรายการและราคาให้ถูกต้อง');
        setIsLoading(true);
        const res = await apiCall('adminAddService', {
          password: adminPassword,
          bookingId: selectedBooking.id,
          item: serviceForm
        });
        if (res.status === 'success') {
          alert('เพิ่มรายการบริการสำเร็จ');
          setActiveModal(null);
          loadAllData(adminPassword);
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
        setIsLoading(false);
      };

      // Filtered Bookings List
      const filteredBookings = useMemo(() => {
        return bookings.filter(b => {
          const matchSearch = (b.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                              (b.phone || '').includes(searchTerm) ||
                              (b.id || '').toLowerCase().includes(searchTerm.toLowerCase());
          const matchStatus = statusFilter === 'ALL' || b.status === statusFilter;
          return matchSearch && matchStatus;
        });
      }, [bookings, searchTerm, statusFilter]);

      // Login Form View
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
              <div className="w-20 h-20 bg-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-3xl">
                <i className="fa-solid fa-campground"></i>
              </div>
              <h1 className="text-2xl font-bold text-slate-800 mb-1">ขนำลุงดำ แคมป์ปิ้ง</h1>
              <p className="text-sm text-slate-500 mb-6">ระบบจัดการผู้ดูแลระบบ (God-Tier Edition)</p>
              
              {loginError && (
                <div className="bg-rose-50 text-rose-600 text-sm p-3 rounded-lg mb-4 border border-rose-200">
                  <i className="fa-solid fa-circle-exclamation mr-2"></i>{loginError}
                </div>
              )}

              <form onSubmit={(e) => { e.preventDefault(); verifyLogin(passwordInput); }}>
                <div className="mb-4 text-left">
                  <label className="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่านแอดมิน</label>
                  <input
                    type="password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder="กรอกรหัสผ่านเพื่อเข้าสู่ระบบ"
                    className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all"
                    required
                  />
                </div>
                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2"
                >
                  {isLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-right-to-bracket"></i>}
                  เข้าสู่ระบบ
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Navigation Bar */}
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md">
                  <i className="fa-solid fa-campground"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">ขนำลุงดำ แคมป์ปิ้ง</h1>
                  <span className="text-xs text-amber-400 font-light">Admin Management Control</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    setWalkinForm({ checkIn: '', checkOut: '', customerName: '', customerPhone: '', guests: 2, selectedRooms: [], foodCart: [], depositPaid: 0 });
                    setActiveModal('walkin');
                  }}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 rounded-xl font-medium shadow transition-all flex items-center gap-2"
                >
                  <i className="fa-solid fa-plus"></i> จอง Walk-in
                </button>
                <button
                  onClick={() => { localStorage.removeItem('kl_admin_pass'); setIsAuthenticated(false); }}
                  className="bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white px-3 py-2 rounded-xl text-sm transition-all"
                  title="ออกจากระบบ"
                >
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="bg-slate-800 border-t border-slate-700/50">
              <div className="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto custom-scrollbar">
                {[
                  { id: 'dashboard', label: 'ภาพรวมระบบ', icon: 'fa-chart-pie' },
                  { id: 'bookings', label: 'รายการจองทั้งหมด', icon: 'fa-list-check' },
                  { id: 'rooms', label: 'ผังห้องพัก & ตั้งค่าแผนที่', icon: 'fa-map-location-dot' },
                  { id: 'settings', label: 'ตั้งค่าระบบ & วันหยุด', icon: 'fa-sliders' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-4 py-3 text-sm font-medium transition-all flex items-center gap-2 border-b-2 whitespace-nowrap ${
                      activeTab === tab.id
                        ? 'border-amber-500 text-amber-400 bg-slate-700/40'
                        : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Body Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

            {/* TAB 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-medium">รายการจองทั้งหมด</p>
                      <h3 className="text-2xl font-bold text-slate-800 mt-1">{bookings.length} รายการ</h3>
                    </div>
                    <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                      <i className="fa-solid fa-bookmark"></i>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-medium">รอตรวจสอบมัดจำ</p>
                      <h3 className="text-2xl font-bold text-amber-600 mt-1">
                        {bookings.filter(b => b.status === 'รอตรวจสอบ').length} รายการ
                      </h3>
                    </div>
                    <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                      <i className="fa-solid fa-clock-rotate-left"></i>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-medium">ยืนยันแล้ว</p>
                      <h3 className="text-2xl font-bold text-emerald-600 mt-1">
                        {bookings.filter(b => b.status === 'ยืนยัน').length} รายการ
                      </h3>
                    </div>
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                      <i className="fa-solid fa-circle-check"></i>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-medium">รายได้รวมมัดจำ</p>
                      <h3 className="text-2xl font-bold text-slate-800 mt-1">
                        ฿{bookings.reduce((sum, b) => sum + (Number(b.deposit) || 0), 0).toLocaleString()}
                      </h3>
                    </div>
                    <div className="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-xl">
                      <i className="fa-solid fa-wallet"></i>
                    </div>
                  </div>
                </div>

                {/* Recent Bookings Overview Table */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 className="font-bold text-slate-800 flex items-center gap-2">
                      <i className="fa-solid fa-clock text-amber-500"></i> รายการจองล่าสุด

                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อห้องพัก</label>
                    <input
                      type="text"
                      value={roomForm.name}
                      onChange={e => setRoomForm({ ...roomForm, name: e.target.value })}
                      placeholder="เช่น ขนำ 1 (ริมน้ำ)"
                      className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ประเภท</label>
                      <select
                        value={roomForm.type}
                        onChange={e => setRoomForm({ ...roomForm, type: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      >
                        <option value="บ้านพัก">บ้านพัก</option>
                        <option value="เต็นท์">เต็นท์</option>
                        <option value="ลานกางเต็นท์">ลานกางเต็นท์</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">อาหารเช้า</label>
                      <select
                        value={roomForm.bf}
                        onChange={e => setRoomForm({ ...roomForm, bf: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      >
                        <option value="ไม่มี">ไม่มี</option>
                        <option value="มี">มี</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">รองรับขั้นต่ำ (คน)</label>
                      <input
                        type="number"
                        value={roomForm.min}
                        onChange={e => setRoomForm({ ...roomForm, min: parseInt(e.target.value) || 1 })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">รองรับสูงสุด (คน)</label>
                      <input
                        type="number"
                        value={roomForm.maxCap}
                        onChange={e => setRoomForm({ ...roomForm, maxCap: parseInt(e.target.value) || 2 })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-3 border-t">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-semibold"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={handleSaveRoomConfig}
                    className="w-1/2 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold shadow"
                  >
                    บันทึกข้อมูล
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 3: ADD SERVICE ================= */}
          {activeModal === 'addService' && selectedBooking && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-lg text-slate-800">เพิ่มบริการ / อาหาร ({selectedBooking.id})</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-xl"></i>
                  </button>
                </div>

                <div className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อรายการบริการ / อาหาร</label>
                    <input
                      type="text"
                      placeholder="เช่น หมูกระทะชุดใหญ่, เสริมฟูก"
                      value={serviceForm.name}
                      onChange={e => setServiceForm({ ...serviceForm, name: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ราคา (บาท)</label>
                      <input
                        type="number"
                        value={serviceForm.price}
                        onChange={e => setServiceForm({ ...serviceForm, price: parseFloat(e.target.value) || 0 })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวน</label>
                      <input
                        type="number"
                        min="1"
                        value={serviceForm.qty}
                        onChange={e => setServiceForm({ ...serviceForm, qty: parseInt(e.target.value) || 1 })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-3 border-t">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-semibold"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={handleAddServiceSubmit}
                    className="w-1/2 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold shadow"
                  >
                    เพิ่มรายการ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 4: VIEW SLIP ================= */}
          {selectedSlipUrl && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-4 max-w-lg w-full relative">
                <button
                  onClick={() => setSelectedSlipUrl(null)}
                  className="absolute top-3 right-3 bg-slate-100 hover:bg-rose-500 hover:text-white w-8 h-8 rounded-full flex items-center justify-center transition-all"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
                <h4 className="font-bold text-sm text-slate-800 mb-3">สลิปการโอนเงิน</h4>
                <img src={selectedSlipUrl} alt="Slip Full" className="w-full max-h-[75vh] object-contain rounded-xl border" />
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
