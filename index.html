<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขนำลุงดำ แคมป์ปิ้ง - จองห้องพักออนไลน์</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Kanit', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // URL ของ Google Apps Script Web App
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_REPLACE_WITH_YOUR_GAS_DEPLOYMENT_ID/exec";

    // Helper: ฟังก์ชันแปลงรูปภาพเป็น Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Helper: จัดรูปแบบวันที่ไทย
    function formatThaiDate(dateStr) {
      if (!dateStr || dateStr === '-') return '-';
      const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    function CustomerApp() {
      // System States
      const [isLoading, setIsLoading] = useState(true);
      const [roomConfig, setRoomConfig] = useState({});
      const [mapConfig, setMapConfig] = useState({});
      const [siteSettings, setSiteSettings] = useState({});
      const [activeTab, setActiveTab] = useState('booking'); // 'booking', 'myBooking'

      // Search & Booking Dates
      const [checkIn, setCheckIn] = useState('');
      const [checkOut, setCheckOut] = useState('');
      const [guests, setGuests] = useState(2);

      // Real-time Availability
      const [bookedRooms, setBookedRooms] = useState([]);
      const [roomAvailableCount, setRoomAvailableCount] = useState({});
      const [isFetchingAvail, setIsFetchingAvail] = useState(false);

      // Cart & Booking Details
      const [cart, setCart] = useState([]);
      const [discountCode, setDiscountCode] = useState('');
      const [discountInfo, setDiscountInfo] = useState(null);
      const [customer, setCustomer] = useState({ name: '', phone: '' });
      const [slipImage, setSlipImage] = useState(null);
      const [slipPreview, setSlipPreview] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [bookingSuccessId, setBookingSuccessId] = useState(null);

      // My Booking Search
      const [searchPhone, setSearchPhone] = useState('');
      const [searchBookingId, setSearchBookingId] = useState('');
      const [foundBookings, setFoundBookings] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      // Initial Load
      useEffect(() => {
        loadInitialData();
      }, []);

      const loadInitialData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(`${SCRIPT_URL}?action=getInitialData`);
          const data = await res.json();
          if (data.status === 'success' && data.data) {
            setRoomConfig(data.data.roomConfig || {});
            setMapConfig(data.data.mapConfig || {});
            setSiteSettings(data.data.siteConfig || {});
          }
        } catch (e) {
          console.error("Fetch Initial Data Error:", e);
        }
        setIsLoading(false);
      };

      // Fetch Availability on Date Change
      useEffect(() => {
        if (checkIn && checkOut) {
          fetchAvailability(checkIn, checkOut);
        }
      }, [checkIn, checkOut]);

      const fetchAvailability = async (cIn, cOut) => {
        setIsFetchingAvail(true);
        try {
          const res = await fetch(`${SCRIPT_URL}?action=getAvailability&checkIn=${cIn}&checkOut=${cOut}`);
          const data = await res.json();
          if (data.status === 'success') {
            setBookedRooms(data.bookedRooms || []);
            setRoomAvailableCount(data.roomAvailableCount || {});
          }
        } catch (e) {
          console.error("Fetch Availability Error:", e);
        }
        setIsFetchingAvail(false);
      };

      // Handle Room Selection
      const handleToggleRoom = (room) => {
        const isBooked = bookedRooms.includes(room.id) || (roomAvailableCount[room.id] !== undefined && roomAvailableCount[room.id] <= 0);
        
        if (isBooked) {
          alert(`ขออภัยครับ ห้อง [${room.name}] ถูกจองแล้วในช่วงวันที่เลือก`);
          return;
        }

        const inCart = cart.find(item => item.id === room.id);
        if (inCart) {
          setCart(cart.filter(item => item.id !== room.id));
        } else {
          setCart([...cart, {
            id: room.id,
            name: room.name,
            type: room.type,
            guests: guests,
            price: 0
          }]);
        }
      };

      // Pricing Calculation
      const pricing = useMemo(() => {
        if (!checkIn || !checkOut) return { roomTotal: 0, discountAmt: 0, netTotal: 0, deposit: 0, nights: 1 };
        const d1 = new Date(checkIn);
        const d2 = new Date(checkOut);
        const nights = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)));

        let roomTotal = 0;
        cart.forEach(item => {
          const room = roomConfig[item.id];
          if (room) {
            const isTent = item.id === 'Z8' || item.id === 'R6528' || (room.type || '').includes('เต็นท์') || (room.name || '').includes('ลานกาง');
            if (isTent) {
              const headPrice = room.pricing?.priceHead || 150;
              roomTotal += (headPrice * guests * nights);
            } else {
              let nightPrice = 1000;
              if (room.pricing?.tiers) {
                const tier = room.pricing.tiers.find(t => guests <= t.max) || room.pricing.tiers[room.pricing.tiers.length - 1];
                nightPrice = tier ? tier.price : 1000;
              }
              roomTotal += (nightPrice * nights);
            }
          }
        });

        let discountAmt = 0;
        if (discountInfo) {
          if (discountInfo.type === 'FIXED') discountAmt = discountInfo.value;
          else if (discountInfo.type === 'PERCENT') discountAmt = (roomTotal * discountInfo.value) / 100;
        }

        const netTotal = Math.max(0, roomTotal - discountAmt);
        const deposit = Math.ceil(netTotal * 0.5);

        return { roomTotal, discountAmt, netTotal, deposit, nights };
      }, [checkIn, checkOut, cart, guests, roomConfig, discountInfo]);

      // Check Discount Code
      const handleCheckDiscount = async () => {
        if (!discountCode) return;
        try {
          const res = await fetch(`${SCRIPT_URL}?action=checkDiscount&code=${encodeURIComponent(discountCode)}`);
          const data = await res.json();
          if (data.status === 'success') {
            setDiscountInfo(data);
            alert('ใช้โค้ดส่วนลดสำเร็จ!');
          } else {
            alert('โค้ดส่วนลดไม่ถูกต้องหรือหมดอายุ');
            setDiscountInfo(null);
          }
        } catch (e) {
          alert('ไม่สามารถตรวจสอบโค้ดได้');
        }
      };

      // Handle Slip File Upload
      const handleSlipChange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) return alert('ไฟล์รูปภาพต้องมีขนาดไม่เกิน 5MB');
          const base64 = await fileToBase64(file);
          setSlipImage(base64);
          setSlipPreview(URL.createObjectURL(file));
        }
      };

      // Submit Booking Form
      const handleSubmitBooking = async () => {
        if (!checkIn || !checkOut) return alert('กรุณาเลือกวันเข้าพักและเช็คเอาท์');
        if (cart.length === 0) return alert('กรุณาเลือกห้องพักอย่างน้อย 1 ห้อง');
        if (!customer.name || !customer.phone) return alert('กรุณากรอกชื่อและเบอร์โทรศัพท์');
        if (!slipImage) return alert('กรุณาแนบสลิปหลักฐานการโอนเงินมัดจำ');

        setIsSubmitting(true);
        try {
          const payload = {
            action: 'saveBooking',
            checkIn,
            checkOut,
            totalGuests: guests,
            cart,
            customer,
            pricing: { netTotal: pricing.netTotal, deposit: pricing.deposit },
            discountCode: discountCode || '-',
            slipImage
          };

          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (data.status === 'success') {
            setBookingSuccessId(data.bookingId);
            setCart([]);
            setSlipImage(null);
            setSlipPreview(null);
          } else {
            alert('ไม่สามารถบันทึกการจองได้: ' + data.message);
          }
        } catch (e) {
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
        }
        setIsSubmitting(false);
      };

      // Search Booking History
      const handleSearchBooking = async () => {
        if (!searchPhone || !searchBookingId) return alert('กรุณากรอกเบอร์โทรและรหัสการจอง');
        setIsSearching(true);
        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'findBooking', phone: searchPhone, bookingId: searchBookingId })
          });
          const data = await res.json();
          if (data.status === 'success') {
            setFoundBookings(data.bookings || []);
          } else {
            alert(data.message || 'ไม่พบประวัติการจอง');
            setFoundBookings([]);
          }
        } catch (e) {
          alert('เกิดข้อผิดพลาดในการค้นหา');
        }
        setIsSearching(false);
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white">
            <i className="fa-solid fa-tent fa-spin text-5xl text-amber-500 mb-4"></i>
            <p className="text-lg font-medium">กำลังโหลดข้อมูล ขนำลุงดำ แคมป์ปิ้ง...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col pb-12">
          {/* Header Banner */}
          <header className="bg-slate-900 text-white shadow-lg relative overflow-hidden">
            <div className="max-w-5xl mx-auto px-4 py-8 relative z-10 text-center">
              <div className="w-20 h-20 bg-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-xl">
                <i className="fa-solid fa-campground text-3xl text-white"></i>
              </div>
              <h1 className="text-3xl font-bold tracking-wide">{siteSettings.headerTitle || "ขนำลุงดำ แคมป์ปิ้ง"}</h1>
              <p className="text-slate-300 text-sm mt-1">{siteSettings.headerDesc || "สัมผัสบรรยากาศธรรมชาติริมน้ำ จองห้องพักได้ง่ายๆ ตลอด 24 ชม."}</p>
              
              {/* Tab Selector */}
              <div className="mt-6 flex justify-center gap-3">
                <button
                  onClick={() => setActiveTab('booking')}
                  className={`px-5 py-2.5 rounded-xl font-semibold text-sm transition-all flex items-center gap-2 ${
                    activeTab === 'booking' ? 'bg-amber-500 text-white shadow-lg scale-105' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <i className="fa-solid fa-calendar-check"></i> จองห้องพัก
                </button>
                <button
                  onClick={() => setActiveTab('myBooking')}
                  className={`px-5 py-2.5 rounded-xl font-semibold text-sm transition-all flex items-center gap-2 ${
                    activeTab === 'myBooking' ? 'bg-amber-500 text-white shadow-lg scale-105' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <i className="fa-solid fa-magnifying-glass"></i> ค้นหาประวัติการจอง
                </button>
              </div>
            </div>
          </header>

          {/* Booking Success Modal */}
          {bookingSuccessId && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl space-y-4">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                  <i className="fa-solid fa-circle-check"></i>
                </div>
                <h3 className="text-2xl font-bold text-slate-800">ส่งข้อมูลการจองสำเร็จ!</h3>
                <p className="text-sm text-slate-600">
                  รหัสการจองของคุณคือ <br/>
                  <span className="font-mono font-bold text-amber-600 text-xl">{bookingSuccessId}</span>
                </p>
                <p className="text-xs text-slate-500 bg-amber-50 p-3 rounded-xl border border-amber-200">
                  สถานะปัจจุบัน: <strong className="text-amber-700">รอตรวจสอบ</strong><br/>
                  ทางที่พักจะทำการตรวจสอบสลิปและยืนยันการจองผ่านระบบโดยเร็วที่สุดครับ
                </p>
                <button
                  onClick={() => setBookingSuccessId(null)}
                  className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all"
                >
                  ตกลง / ปิดหน้าต่าง
                </button>
              </div>
            </div>
          )}

          <main className="flex-1 max-w-5xl w-full mx-auto px-4 mt-6">
            {/* TAB 1: BOOKING FORM */}
            {activeTab === 'booking' && (
              <div className="space-y-6">

                {/* Step 1: Select Dates & Guests */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2 border-b pb-3">
                    <i className="fa-solid fa-calendar-days text-amber-500"></i> 1. เลือกวันที่และจำนวนผู้เข้าพัก
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">วันเข้าพัก (Check-in)</label>
                      <input
                        type="date"
                        value={checkIn}
                        onChange={e => setCheckIn(e.target.value)}
                        className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">วันเช็คเอาท์ (Check-out)</label>
                      <input
                        type="date"
                        value={checkOut}
                        onChange={e => setCheckOut(e.target.value)}
                        className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนผู้เข้าพัก (ท่าน)</label>
                      <input
                        type="number"
                        min="1"
                        value={guests}
                        onChange={e => setGuests(parseInt(e.target.value) || 1)}
                        className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                {/* Step 2: Interactive Map Room Selector */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                      <i className="fa-solid fa-map-location-dot text-amber-500"></i> 2. เลือกห้องพักบนแผนที่
                    </h3>
                    {isFetchingAvail && (
                      <span className="text-xs text-amber-600 font-medium">
                        <i className="fa-solid fa-spinner fa-spin mr-1"></i> กำลังตรวจสอบห้องว่าง...
                      </span>
                    )}
                  </div>

                  {!checkIn || !checkOut ? (
                    <div className="p-10 text-center text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                      <i className="fa-regular fa-calendar-xmark text-4xl mb-2"></i>
                      <p className="text-sm">กรุณาเลือกวันเข้าพักและวันเช็คเอาท์ก่อนกดเลือกห้องพัก</p>
                    </div>
                  ) : (
                    <div className="relative w-full h-[380px] bg-slate-200 rounded-2xl overflow-hidden border border-slate-300 shadow-inner">
                      <img src={siteSettings.bannerUrl || "https://placehold.co/800x400?text=Resort+Map"} alt="Resort Map" className="w-full h-full object-cover opacity-75" />
                      <div className="absolute inset-0 bg-black/10"></div>

                      {/* Map Pins */}
                      {Object.values(roomConfig).map(room => {
                        const pos = mapConfig[room.id] || { x: 50, y: 50 };
                        const isBooked = bookedRooms.includes(room.id) || (roomAvailableCount[room.id] !== undefined && roomAvailableCount[room.id] <= 0);
                        const isSelected = cart.some(item => item.id === room.id);

                        return (
                          <button
                            key={room.id}
                            type="button"
                            disabled={isBooked}
                            onClick={() => handleToggleRoom(room)}
                            style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
                            className={`absolute transform -translate-x-1/2 -translate-y-1/2 px-3 py-1.5 rounded-xl font-bold text-xs shadow-xl transition-all flex items-center gap-1.5 ${
                              isBooked
                                ? 'bg-rose-600 text-white cursor-not-allowed opacity-80 pointer-events-none'
                                : isSelected
                                ? 'bg-amber-500 text-white ring-4 ring-amber-300 scale-110 z-10'
                                : 'bg-emerald-600 hover:bg-emerald-500 text-white hover:scale-105'
                            }`}
                          >
                            <i className={`fa-solid ${isBooked ? 'fa-lock' : isSelected ? 'fa-circle-check' : 'fa-bed'}`}></i>
                            {room.name} {isBooked ? '(จองแล้ว)' : ''}
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Room Cards Selector */}
                  {checkIn && checkOut && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                      {Object.values(roomConfig).map(room => {
                        const isBooked = bookedRooms.includes(room.id) || (roomAvailableCount[room.id] !== undefined && roomAvailableCount[room.id] <= 0);
                        const isSelected = cart.some(item => item.id === room.id);

                        return (
                          <div
                            key={room.id}
                            className={`p-4 rounded-2xl border transition-all ${
                              isBooked
                                ? 'bg-rose-50 border-rose-200 text-slate-400'
                                : isSelected
                                ? 'bg-amber-50 border-amber-500 text-amber-900 shadow-sm'
                                : 'bg-white border-slate-200 hover:border-amber-400'
                            }`}
                          >
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="font-bold text-base text-slate-800">{room.name}</h4>
                                <span className="text-xs text-slate-500">{room.type} (รองรับ {room.min}-{room.maxCap} ท่าน)</span>
                              </div>
                              <span className={`px-2 py-0.5 rounded-full text-[11px] font-bold ${
                                isBooked ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'
                              }`}>
                                {isBooked ? 'ไม่ว่าง' : 'ว่าง'}
                              </span>
                            </div>

                            <div className="mt-4 flex justify-between items-center">
                              <span className="text-xs text-slate-600 font-semibold">
                                ฿{room.pricing?.tiers ? room.pricing.tiers[0]?.price : room.pricing?.priceHead || 0} / คืน
                              </span>
                              <button
                                type="button"
                                disabled={isBooked}
                                onClick={() => handleToggleRoom(room)}
                                className={`px-4 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                  isBooked
                                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                    : isSelected
                                    ? 'bg-amber-500 text-white'
                                    : 'bg-slate-900 hover:bg-amber-500 text-white'
                                }`}
                              >
                                {isBooked ? 'จองแล้ว' : isSelected ? 'ยกเลิกเลือก' : 'เลือกห้องนี้'}
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                {/* Step 3: Customer Details & Slip Upload */}
                {cart.length > 0 && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2 border-b pb-3">
                      <i className="fa-solid fa-file-invoice-dollar text-amber-500"></i> 3. สรุปยอดเงินและแนบหลักฐานชำระเงิน
                    </h3>

                    {/* Cart Summary */}
                    <div className="bg-slate-50 p-4 rounded-xl space-y-2 text-sm">
                      <div className="font-semibold text-slate-700">รายการห้องพักที่เลือก:</div>
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between items-center text-xs text-slate-600">
                          <span>• {item.name} ({guests} ท่าน)</span>
                          <span className="font-mono">พัก {pricing.nights} คืน</span>
                        </div>
                      ))}

                      {/* Discount Input */}
                      <div className="pt-2 border-t flex gap-2">
                        <input
                          type="text"
                          placeholder="โค้ดส่วนลด (ถ้ามี)"
                          value={discountCode}
                          onChange={e => setDiscountCode(e.target.value.toUpperCase())}
                          className="px-3 py-1.5 rounded-lg border text-xs focus:outline-none uppercase"
                        />
                        <button
                          type="button"
                          onClick={handleCheckDiscount}
                          className="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-700"
                        >
                          ใช้งาน
                        </button>
                      </div>

                      {/* Pricing Breakdown */}
                      <div className="pt-2 border-t text-right space-y-1">
                        <div className="text-xs text-slate-500">ยอดรวมทั้งหมด: ฿{pricing.roomTotal.toLocaleString()}</div>
                        {pricing.discountAmt > 0 && <div className="text-xs text-emerald-600">ส่วนลด: -฿{pricing.discountAmt.toLocaleString()}</div>}
                        <div className="text-base font-bold text-slate-800">ยอดรวมสุทธิ: ฿{pricing.netTotal.toLocaleString()}</div>
                        <div className="text-sm font-bold text-amber-600">ยอดมัดจำที่ต้องโอน (50%): ฿{pricing.deposit.toLocaleString()}</div>
                      </div>
                    </div>

                    {/* Customer Info Form */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อ - นามสกุล ผู้จอง *</label>
                        <input
                          type="text"
                          placeholder="กรอกชื่อ-นามสกุล"
                          value={customer.name}
                          onChange={e => setCustomer({ ...customer, name: e.target.value })}
                          className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์ *</label>
                        <input
                          type="tel"
                          placeholder="กรอกเบอร์โทรศัพท์"
                          value={customer.phone}
                          onChange={e => setCustomer({ ...customer, phone: e.target.value })}
                          className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    {/* Bank Account Info & Slip Upload */}
                    <div className="p-4 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-900 space-y-2">
                      <div className="font-bold">🏦 บัญชีสำหรับโอนเงินมัดจำ:</div>
                      <div>ธนาคารกสิกรไทย (K-Bank): <span className="font-mono font-bold text-sm">xxx-x-xxxxx-x</span> (ขนำลุงดำ)</div>
                      <div>ยอดมัดจำที่ต้องโอน: <strong className="text-sm text-amber-700">฿{pricing.deposit.toLocaleString()} บาท</strong></div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">แนบสลิปการโอนเงิน *</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleSlipChange}
                        className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100"
                      />
                      {slipPreview && (
                        <div className="mt-3 w-32 h-44 rounded-xl border overflow-hidden shadow-sm">
                          <img src={slipPreview} alt="Slip" className="w-full h-full object-cover" />
                        </div>
                      )}
                    </div>

                    <button
                      type="button"
                      onClick={handleSubmitBooking}
                      disabled={isSubmitting}
                      className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-base flex items-center justify-center gap-2"
                    >
                      {isSubmitting ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                      ยืนยันการจองห้องพัก
                    </button>
                  </div>
                )}

              </div>
            )}

            {/* TAB 2: MY BOOKING SEARCH */}
            {activeTab === 'myBooking' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 max-w-2xl mx-auto">
                <h3 className="font-bold text-lg text-slate-800 border-b pb-3">ค้นหาประวัติการจองห้องพัก</h3>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์ที่ใช้จอง</label>
                    <input
                      type="tel"
                      placeholder="กรอกเบอร์โทรศัพท์"
                      value={searchPhone}
                      onChange={e => setSearchPhone(e.target.value)}
                      className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">รหัสการจอง (Booking ID)</label>
                    <input
                      type="text"
                      placeholder="เช่น BK-241012-XXXX"
                      value={searchBookingId}
                      onChange={e => setSearchBookingId(e.target.value)}
                      className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none font-mono"
                    />
                  </div>
                  <button
                    onClick={handleSearchBooking}
                    disabled={isSearching}
                    className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-bold shadow transition-all flex items-center justify-center gap-2"
                  >
                    {isSearching ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-magnifying-glass"></i>}
                    ค้นหาข้อมูลการจอง
                  </button>
                </div>

                {/* Found Bookings Results */}
                {foundBookings.length > 0 && (
                  <div className="space-y-4 pt-4 border-t">
                    <h4 className="font-bold text-sm text-slate-800">ผลการค้นหา ({foundBookings.length} รายการ):</h4>
                    {foundBookings.map(b => (
                      <div key={b.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="font-mono font-bold text-amber-600 text-sm">{b.id}</span>
                            <div className="font-bold text-slate-800 text-base">{b.name}</div>
                          </div>
                          <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                            b.status === 'ยืนยัน' ? 'bg-emerald-100 text-emerald-700' :
                            b.status === 'รอตรวจสอบ' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                          }`}>
                            {b.status}
                          </span>
                        </div>
                        <div className="text-xs text-slate-600 space-y-1 pt-2 border-t">
                          <div>📅 วันเข้าพัก: {formatThaiDate(b.checkIn)} - {formatThaiDate(b.checkOut)}</div>
                          <div>🏠 รายการห้องพัก: {b.rooms}</div>
                          <div>🍽️ อาหาร/บริการเสริม: {b.food}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerApp />);
  </script>
</body>
</html>
