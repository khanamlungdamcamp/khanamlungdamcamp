    <script>
        function generatePromptPayPayload(phoneNumber, amount) {
            const target = phoneNumber.replace(/^0/, '66');
            const f01 = '00' + target; 
            const tag29Value = '0016A000000677010111' + '01' + String(f01.length).padStart(2,'0') + f01;
            const tag29 = '29' + String(tag29Value.length).padStart(2,'0') + tag29Value;
            const tag53 = '5303764';
            const amtStr = amount.toFixed(2);
            const tag54 = '54' + String(amtStr.length).padStart(2,'0') + amtStr;
            const tag58 = '5802TH';
            const data = '000201' + '010212' + tag29 + tag53 + tag54 + tag58 + '6304';
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                let x = ((crc >> 8) ^ data.charCodeAt(i)) & 0xFF; x ^= x >> 4; crc = ((crc << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xFFFF;
            }
            return data + crc.toString(16).toUpperCase().padStart(4, '0');
        }

        function createQRWithLogo(payload, size, shopLogoUrl) {
            return new Promise((resolve) => {
                const qr = new QRious({ value: payload, size: size, level: 'H' });
                const qrBase64 = qr.toDataURL();
                
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                const qrImg = new Image();
                qrImg.onload = () => {
                    ctx.drawImage(qrImg, 0, 0);
                    
                    const drawLogo = (imgSrc, isFallback = false) => {
                        const logoImg = new Image();
                        logoImg.crossOrigin = "Anonymous";
                        logoImg.onload = () => {
                            const logoSize = size * 0.22;
                            const x = (size - logoSize) / 2;
                            const y = (size - logoSize) / 2;
                            const pad = 6;
                            
                            ctx.fillStyle = 'white';
                            if (ctx.roundRect) {
                                ctx.beginPath();
                                ctx.roundRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2, 8);
                                ctx.fill();
                            } else {
                                ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);
                            }
                            
                            ctx.drawImage(logoImg, x, y, logoSize, logoSize);
                            resolve(canvas.toDataURL('image/png'));
                        };
                        logoImg.onerror = () => {
                            if (!isFallback) {
                                drawLogo("https://upload.wikimedia.org/wikipedia/commons/e/e0/PromptPay-logo.png", true);
                            } else {
                                resolve(qrBase64);
                            }
                        };
                        logoImg.src = imgSrc;
                    };
                    
                    if (shopLogoUrl) {
                        drawLogo(shopLogoUrl);
                    } else {
                        drawLogo("https://upload.wikimedia.org/wikipedia/commons/e/e0/PromptPay-logo.png", true);
                    }
                };
                qrImg.src = qrBase64;
            });
        }

        function checkSlipQR(base64Str, promptpayPhone, callback) {
            if (typeof jsQR === 'undefined') { callback(null); return; }
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code) {
                    const phoneRaw = promptpayPhone.replace(/\D/g, ''); 
                    const phone66 = "66" + phoneRaw.substring(1); 
                    if (code.data.includes(phoneRaw) || code.data.includes(phone66)) {
                        callback({ type: 'success', msg: 'slipValid' });
                    } else {
                        callback({ type: 'error', msg: 'slipWarningWrongQR' });
                    }
                } else {
                    callback({ type: 'warning', msg: 'slipWarningNoQR' });
                }
            };
            img.src = base64Str;
        }
    </script>

        const fetchWithTimeout = async (resource, options = {}) => {
            const { timeout = 30000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        };

        const compressImage = async (file, quality = 0.9, maxWidth = 1000) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        const head = 'data:image/jpeg;base64,';
                        const sizeInBytes = Math.round((dataUrl.length - head.length) * 3 / 4);
                        if (sizeInBytes > 500000 && quality > 0.3) {
                            resolve(compressImage(file, quality - 0.2, maxWidth * 0.8)); 
                        } else { resolve(dataUrl); }
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        };

        const DateRangePicker = ({ dates, setDates, closedDates, specialDates, fullyBookedDates, lang, t, setModalAlert, formatDateLocalized }) => {
            const [viewDate, setViewDate] = React.useState(new Date());
            
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayStr = toLocalISOString(today);
            
            const monthNamesTH = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const monthNamesEN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dayNamesTH = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
            const dayNamesEN = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
            
            const months = lang === 'en' ? monthNamesEN : monthNamesTH;
            const days = lang === 'en' ? dayNamesEN : dayNamesTH;
            const yearOffset = lang === 'en' ? 0 : 543;
            
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
            
            const handlePrevMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1));
            const handleNextMonth = () => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1));
            
            const handleDateClick = (dateObj) => {
                const dateStr = toLocalISOString(dateObj);
                
                if (closedDates.some(c => c.date === dateStr)) return;
                if (dateStr <= todayStr) return; 
                
                if (!dates.checkIn || (dates.checkIn && dates.checkOut)) {
                    // คลิกครั้งแรก (เลือกวัน Check-In) -> ถ้าวันนั้นเต็มห้ามคลิก
                    if (fullyBookedDates.includes(dateStr)) {
                        setModalAlert({ show: true, type: 'warning', title: t('notice'), text: t('errFullyBookedDate') });
                        return;
                    }
                    setDates({ checkIn: dateStr, checkOut: '' });
                } else {
                    // คลิกครั้งที่สอง (เลือกวัน Check-Out)
                    if (dateStr > dates.checkIn) {
                        let current = new Date(dates.checkIn);
                        let end = new Date(dateStr);
                        let hasIssue = false;
                        
                        current = new Date(current.getTime() + Math.abs(current.getTimezoneOffset() * 60000));
                        end = new Date(end.getTime() + Math.abs(end.getTimezoneOffset() * 60000));

                        while(current < end) {
                            const dStr = toLocalISOString(current);
                            // ถ้าช่วงที่ลากคร่อมมีวันปิดร้าน หรือ วันที่เต็มแล้ว ให้แจ้งเตือนและยกเลิก
                            if (closedDates.some(c => c.date === dStr) || fullyBookedDates.includes(dStr)) {
                                hasIssue = true; break;
                            }
                            current.setDate(current.getDate() + 1);
                        }
                        
                        if(hasIssue) {
                            setModalAlert({ show: true, type: 'error', title: t('error'), text: t('errCrossClosed') });
                            setDates({ checkIn: dateStr, checkOut: '' }); // รีเซ็ตให้เลือกใหม่
                        } else {
                            setDates({ ...dates, checkOut: dateStr });
                        }
                    } else {
                        // เลือดย้อนหลัง -> รีเซ็ตเป็นวัน Check-In ใหม่
                        if (fullyBookedDates.includes(dateStr)) {
                            setModalAlert({ show: true, type: 'warning', title: t('notice'), text: t('errFullyBookedDate') });
                            return;
                        }
                        setDates({ checkIn: dateStr, checkOut: '' });
                    }
                }
            };

            const renderCalendar = () => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const daysInMonth = getDaysInMonth(year, month);
                const firstDay = getFirstDayOfMonth(year, month);
                
                const grid = [];
                for (let i = 0; i < firstDay; i++) grid.push(<div key={`empty-${i}`} className="w-9 h-9"></div>);
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateObj = new Date(year, month, i);
                    const dateStr = toLocalISOString(dateObj);
                    
                    const isPast = dateStr <= todayStr;
                    const isClosed = closedDates.some(c => c.date === dateStr);
                    const isFull = fullyBookedDates.includes(dateStr);
                    const isSpecial = specialDates.some(s => s.date === dateStr);
                    
                    const isCheckIn = dates.checkIn === dateStr;
                    const isCheckOut = dates.checkOut === dateStr;
                    const isInBetween = dates.checkIn && dates.checkOut && dateStr > dates.checkIn && dateStr < dates.checkOut;
                    
                    let baseClasses = "w-9 h-9 flex flex-col items-center justify-center text-sm rounded-full relative transition-all duration-200 cursor-pointer ";
                    
                    if (isPast) {
                        baseClasses += "text-gray-300 dark:text-gray-600 cursor-not-allowed ";
                    } else if (isClosed) {
                        baseClasses += "bg-red-50 dark:bg-red-900/30 text-red-400 dark:text-red-500 line-through cursor-not-allowed ";
                    } else if (isCheckIn || isCheckOut) {
                        baseClasses += "bg-green-600 text-white font-bold shadow-md transform scale-110 ";
                    } else if (isInBetween) {
                        baseClasses += "bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 ";
                    } else if (isFull) {
                        baseClasses += "bg-gray-100 dark:bg-gray-700/50 text-gray-400 dark:text-gray-500 cursor-not-allowed ";
                    } else {
                        baseClasses += "hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 ";
                    }

                    grid.push(
                        <div key={i} className="flex justify-center items-center py-1">
                            <div className={baseClasses} onClick={() => handleDateClick(dateObj)}>
                                <span className="z-10">{i}</span>
                                {isSpecial && !isCheckIn && !isCheckOut && !isPast && !isClosed && (
                                    <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-400 rounded-full"></div>
                                )}
                            </div>
                        </div>
                    );
                }
                return grid;
            };

            return (
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow border border-gray-100 dark:border-gray-700 p-4 mb-4 select-none">
                    <div className="flex justify-between items-center mb-4">
                        <p className="font-bold text-gray-800 dark:text-white text-sm"><i className="fas fa-calendar-alt text-green-600 mr-2"></i> {t('selectDates')}</p>
                        <button onClick={() => setDates({checkIn:'', checkOut:''})} className="text-xs text-red-500 hover:text-red-700 underline">{t('clearDates')}</button>
                    </div>
                    
                    <div className="flex justify-between items-center mb-2 px-2">
                        <button onClick={handlePrevMonth} className="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300"><i className="fas fa-chevron-left"></i></button>
                        <div className="font-bold text-gray-800 dark:text-white">{months[viewDate.getMonth()]} {viewDate.getFullYear() + yearOffset}</div>
                        <button onClick={handleNextMonth} className="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300"><i className="fas fa-chevron-right"></i></button>
                    </div>

                    <div className="grid grid-cols-7 gap-1 mb-2">
                        {days.map((d, idx) => (
                            <div key={idx} className="text-center text-xs font-bold text-gray-400 dark:text-gray-500">{d}</div>
                        ))}
                    </div>

                    <div className="grid grid-cols-7 gap-y-1 gap-x-1">
                        {renderCalendar()}
                    </div>

                    <div className="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700 flex flex-col gap-2">
                        <div className="flex justify-between text-xs text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-700/50 p-2 rounded">
                            <span><b>In:</b> {dates.checkIn ? formatDateLocalized(dates.checkIn) : '-'}</span>
                            <span><b>Out:</b> {dates.checkOut ? formatDateLocalized(dates.checkOut) : '-'}</span>
                        </div>
                        <div className="flex justify-center flex-wrap gap-x-3 gap-y-2 text-[10px] text-gray-500 dark:text-gray-400 mt-1">
                            <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-green-600 mr-1"></div>{t('legendSelected')}</span>
                            <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-orange-400 mr-1"></div>{t('legendSpecial')}</span>
                            <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-gray-300 dark:bg-gray-600 mr-1"></div>{t('legendFull')}</span>
                            <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-red-100 border border-red-300 mr-1"></div>{t('legendClosed')}</span>
                        </div>
                    </div>
                </div>
            );
        };
        
        const App = () => {
            const [isDark, setIsDark] = React.useState(true);
            
            const [lang, setLang] = React.useState(() => {
                const saved = localStorage.getItem('khanam_lang');
                if (saved) return saved;
                const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                return browserLang.includes('th') ? 'th' : 'en'; 
            });

            const [step, setStep] = React.useState(1);
            const [mode, setMode] = React.useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('mode') === 'manage' ? 'manage' : 'booking';
            }); 
            
            const [viewStyle, setViewStyle] = React.useState('map'); 

            const [isInitializing, setIsInitializing] = React.useState(true); 
            const [dates, setDates] = React.useState({ checkIn: '', checkOut: '' });
            const [availability, setAvailability] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [cart, setCart] = React.useState([]);
            const [customer, setCustomer] = React.useState({ name: '', phone: '', userId: '', lineDisplayName: '' });
            const [isLiffReady, setIsLiffReady] = React.useState(false);
            const [pinPos, setPinPos] = React.useState(DEFAULT_POSITIONS);
            
            const [roomConfig, setRoomConfig] = React.useState({});
            const [systemSettings, setSystemSettings] = React.useState({ closed: [], special: [], fullyBookedDates: [] });
            const [siteConfig, setSiteConfig] = React.useState(DEFAULT_CONFIG);

            const [discount, setDiscount] = React.useState({ code: '', val: 0, type: '', message: '', status: '' });
            const [checkingDiscount, setCheckingDiscount] = React.useState(false);
            
            const [slipImg, setSlipImg] = React.useState(null);
            const [slipStatus, setSlipStatus] = React.useState(null); 
            
            const [bookingResult, setBookingResult] = React.useState(null);
            const [agreed, setAgreed] = React.useState(false);
            const [qrUrl, setQrUrl] = React.useState(null);
            
            const [selectedRoomId, setSelectedRoomId] = React.useState(null);
            const [guestCount, setGuestCount] = React.useState(1);
            const [selectedFood, setSelectedFood] = React.useState(null);
            const [foodCount, setFoodCount] = React.useState(1);
            const [foodNote, setFoodNote] = React.useState('');
            const [closedModal, setClosedModal] = React.useState(null); 
            const [searchError, setSearchError] = React.useState(null);
            const [currentImgIdx, setCurrentImgIdx] = React.useState(0);
            const [showRoomRequiredModal, setShowRoomRequiredModal] = React.useState(false);

            const [manageData, setManageData] = React.useState(null);
            const [bookingList, setBookingList] = React.useState([]); 
            const [rescheduleDates, setRescheduleDates] = React.useState({ checkIn: '', checkOut: '' });
            const [manageTab, setManageTab] = React.useState('info'); 
            const [addOnCart, setAddOnCart] = React.useState([]); 
            
            const [addOnSlip, setAddOnSlip] = React.useState(null);
            const [addOnSlipStatus, setAddOnSlipStatus] = React.useState(null);

            const [addOnQr, setAddOnQr] = React.useState(null);
            const [manageForm, setManageForm] = React.useState({ bookingId: '', phone: '' });

            const [modalAlert, setModalAlert] = React.useState({ show: false, type: 'info', title: '', text: '' }); 
            const [modalConfirm, setModalConfirm] = React.useState({ show: false, title: '', text: '', onConfirm: null });

            // Scroll to Top on Step/Mode Change
            React.useEffect(() => {
                window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
            }, [step, mode, manageTab]);

            const t = (key, params = {}) => {
                let text = TRANSLATIONS[lang][key] || key;
                for (let k in params) {
                    text = text.replace(`{${k}}`, params[k]);
                }
                return text;
            };

            const tData = (text, forceLang = null) => {
                if (!text) return "";
                const parts = String(text).split('|');
                const targetLang = forceLang || lang;
                if (targetLang === 'en' && parts.length > 1) {
                    return parts[1].trim();
                }
                return parts[0].trim();
            };

            const tDataList = (text) => {
                if(!text || text === '-') return text;
                return text.split(',').map(item => {
                    const parts = item.split('|');
                    if (parts.length > 1) {
                        const th = parts[0].trim();
                        let en = parts[1].trim();
                        let suffix = '';
                        
                        const match = en.match(/(x\d+|\(\d+\s*ท่าน\)|\(\d+\s*คน\))$/);
                        if (match) {
                            let rawSuffix = match[1];
                            if (lang === 'en') {
                                rawSuffix = rawSuffix.replace('ท่าน', 'Guests').replace('คน', 'Guests');
                            }
                            suffix = ' ' + rawSuffix;
                            en = en.replace(match[1], '').trim();
                        }
                        return lang === 'en' ? `${en}${suffix}` : `${th}${suffix}`;
                    }
                    return item.trim();
                }).join('\n'); 
            };

            const toggleLanguage = () => {
                const newLang = lang === 'th' ? 'en' : 'th';
                setLang(newLang);
                localStorage.setItem('khanam_lang', newLang);
            };

            const getTommorow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return toLocalISOString(d); };
            
            const formatDateLocalized = (dateStr) => { 
                if(!dateStr) return "-"; 
                const d = new Date(dateStr); 
                if (lang === 'en') {
                    const m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]; 
                    return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
                } else {
                    const m = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."]; 
                    return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear() + 543}`;
                }
            };
            
            const getClosedDateOverlap = (inDate, outDate) => {
                if (!inDate || !outDate) return null;
                let current = new Date(inDate); const end = new Date(outDate);
                while(current < end) { 
                    const dStr = toLocalISOString(current); 
                    const closed = systemSettings.closed.find(c => c.date === dStr); 
                    if (closed) return closed; 
                    current.setDate(current.getDate() + 1); 
                }
                return null;
            };

            const checkDateOverlapHighSeason = (inDate, outDate) => {
                if (!inDate || !outDate) return false;
                let current = new Date(inDate); const end = new Date(outDate);
                while(current < end) { 
                    const dStr = toLocalISOString(current); 
                    if (systemSettings.special.some(s => s.date === dStr)) return true; 
                    current.setDate(current.getDate() + 1); 
                }
                return false;
            };

            const calculateNights = () => { if(!dates.checkIn || !dates.checkOut) return 0; return Math.round((new Date(dates.checkOut) - new Date(dates.checkIn)) / (1000 * 3600 * 24)); }
            
            const getPricing = () => {
                const nights = calculateNights(); let roomTotal = 0; let foodTotal = 0; let z8Total = 0;
                
                cart.forEach(item => { 
                    if (item.type === 'food') foodTotal += Number(item.price||0) * Number(item.qty||1); 
                    else if (item.isPerHead) z8Total += Number(item.pricePerNight||0) * nights * Number(item.guests||1); 
                    else roomTotal += Number(item.pricePerNight||0) * nights; 
                });
                
                let discountAmt = 0; if (discount.type === 'FIXED') discountAmt = Number(discount.val||0); if (discount.type === 'PERCENT') discountAmt = (roomTotal * Number(discount.val||0)) / 100; if (discountAmt > roomTotal) discountAmt = roomTotal; 
                const totalBefore = roomTotal + z8Total + foodTotal; const netTotal = totalBefore - discountAmt;
                
                let deposit = 0; const isHigh = checkDateOverlapHighSeason(dates.checkIn, dates.checkOut);
                
                if (isHigh) {
                    deposit = netTotal; 
                } else { 
                    const roomDeposit = (roomTotal - discountAmt) * 0.5; 
                    deposit = roomDeposit + z8Total + foodTotal; 
                }
                return { total: totalBefore, discount: discountAmt, netTotal: netTotal, deposit: Math.ceil(deposit), isHighSeason: isHigh };
            };
            
            const isBookingPast = (dateStr) => {
                if(!dateStr) return false;
                const today = new Date();
                today.setHours(0,0,0,0);
                const checkOutDate = new Date(dateStr);
                checkOutDate.setHours(0,0,0,0);
                return checkOutDate < today;
            };

            const pricing = React.useMemo(() => getPricing(), [cart, dates, discount, systemSettings]);
            const canSubmit = customer.name && customer.phone && slipImg && agreed;

            React.useEffect(() => {
                setIsInitializing(true);
                if (LIFF_ID) {
                    liff.init({ liffId: LIFF_ID }).then(() => {
                        setIsLiffReady(true);
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                setCustomer(prev => ({...prev, userId: profile.userId, lineDisplayName: profile.displayName}));
                            });
                        } else {
                            liff.login({ redirectUri: window.location.href });
                        }
                    }).catch(err => { console.error('LIFF Error', err); setIsLiffReady(true); });
                } else { setIsLiffReady(true); }
                
                const cachedData = sessionStorage.getItem('khanam_init_data');
                if (cachedData) {
                    try {
                        const parsed = JSON.parse(cachedData);
                        setSystemSettings({ closed: parsed.settings.closed, special: parsed.settings.special, fullyBookedDates: parsed.settings.fullyBookedDates || [] });
                        setSiteConfig(prev => ({ ...prev, ...parsed.siteConfig }));
                        setRoomConfig(parsed.roomConfig);
                        setPinPos(parsed.mapConfig);
                        setIsInitializing(false); 
                    } catch(e) {
                        console.error('Cache parsing error', e);
                    }
                }

                fetchWithTimeout(`${GOOGLE_SCRIPT_URL}?action=getInitialData`).then(r => r.json()).then(res => {
                    if (res.status === 'success') {
                        const { settings, siteConfig, roomConfig, mapConfig } = res.data;
                        setSystemSettings({ closed: settings.closed, special: settings.special, fullyBookedDates: settings.fullyBookedDates || [] });
                        setSiteConfig(prev => ({ ...prev, ...siteConfig }));
                        setRoomConfig(roomConfig);
                        setPinPos(mapConfig);
                        sessionStorage.setItem('khanam_init_data', JSON.stringify(res.data));
                    }
                    setIsInitializing(false);
                }).catch(e=>{
                    console.error(e);
                    setIsInitializing(false);
                });
            }, []);

            React.useEffect(() => {
                if (step === 3 && pricing.deposit > 0) {
                    const payload = generatePromptPayPayload(PROMPTPAY_PHONE, pricing.deposit); 
                    createQRWithLogo(payload, 400, siteConfig.logoUrl).then(url => setQrUrl(url));
                }
            }, [step, pricing.deposit, siteConfig.logoUrl]);

            React.useEffect(() => {
                if (mode === 'manage' && manageTab === 'food') {
                    const total = addOnCart.reduce((sum,c)=>sum+(c.price*c.qty),0);
                    if (total > 0) { 
                        const payload = generatePromptPayPayload(PROMPTPAY_PHONE, total); 
                        createQRWithLogo(payload, 400, siteConfig.logoUrl).then(url => setAddOnQr(url)); 
                    } else { setAddOnQr(null); }
                }
            }, [addOnCart, mode, manageTab, siteConfig.logoUrl]);

            React.useEffect(() => {
                if (mode === 'manage' && isLiffReady && customer.userId && !manageData) {
                    setLoading(true);
                    fetchWithTimeout(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'findBooking', userId: customer.userId }) })
                    .then(r => r.json())
                    .then(res => {
                        setLoading(false);
                        if(res.status === 'success' && res.bookings && res.bookings.length > 0) { 
                            setBookingList(res.bookings); 
                            const params = new URLSearchParams(window.location.search);
                            const targetId = params.get('id');
                            if (targetId) {
                                const targetBooking = res.bookings.find(b => b.id === targetId);
                                if (targetBooking) {
                                    selectBookingToManage(targetBooking);
                                }
                            }
                        } else { setBookingList([]); }
                    }).catch(e => {
                        setLoading(false);
                    });
                }
            }, [mode, isLiffReady, customer.userId, manageData]);

            const handleSearch = () => {
                if (!dates.checkIn || !dates.checkOut) { setSearchError(lang === 'en' ? 'Please select both check-in and check-out dates.' : 'กรุณาเลือกวันเข้าพักและวันที่ออกให้ครบถ้วนครับ'); return; }
                if (dates.checkIn >= dates.checkOut) { setSearchError(lang === 'en' ? 'Check-out date must be after check-in date.' : 'วันเช็คเอาท์ต้องอยู่หลังจากวันเช็คอินครับ'); return; }
                const closedFound = getClosedDateOverlap(dates.checkIn, dates.checkOut); if (closedFound) { setClosedModal(closedFound); return; }
                setLoading(true);
                fetchWithTimeout(`${GOOGLE_SCRIPT_URL}?action=getAvailability&checkIn=${dates.checkIn}&checkOut=${dates.checkOut}&_t=${Date.now()}`)
                .then(r => r.json()).then(data => { setAvailability(data); setStep(2); setLoading(false); })
                .catch(e => { setLoading(false); alert(e.name === 'AbortError' ? (lang==='en'?'Connection timeout, please try again.':'การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองอีกครั้งครับ') : 'Error: ' + e); });
            };

            const openRoomModal = (roomId) => { 
                const room = roomConfig[roomId]; 
                if (!room) return; 
                const searchStr = (room.type + " " + room.name).toLowerCase();
                const isSharedZone = room.type === 'ground' || roomId === 'Z8' || roomId === 'R6528' || searchStr.includes('ลานกาง') || searchStr.includes('ground');
                
                if(isSharedZone) setGuestCount(1); 
                else setGuestCount(parseInt(room.min) || 1); 
                
                setCurrentImgIdx(0); 
                setSelectedRoomId(roomId); 
            };

            const openFoodModal = (food) => { setSelectedFood(food); setFoodCount(1); setFoodNote(''); };
            
            const confirmFoodSelection = () => {
                const targetCart = mode === 'manage' ? addOnCart : cart; 
                const setTargetCart = mode === 'manage' ? setAddOnCart : setCart;
                
                const finalName = foodNote.trim() 
                    ? `${tData(selectedFood.name, 'th')} (${foodNote.trim()}) | ${tData(selectedFood.name, 'en')} (${foodNote.trim()})` 
                    : selectedFood.name;

                const existIndex = targetCart.findIndex(c => c.id === selectedFood.id && c.name === finalName && c.type === 'food');
                
                if (existIndex > -1) {
                    const newCart = [...targetCart];
                    newCart[existIndex].qty += foodCount;
                    setTargetCart(newCart);
                } else { 
                    setTargetCart([...targetCart, { ...selectedFood, name: finalName, type: 'food', qty: foodCount }]);
                }
                
                setSelectedFood(null);
                setFoodNote('');
            };

            const nextImage = () => { if(!selectedRoomId) return; const images = siteConfig.roomImages[selectedRoomId] || []; setCurrentImgIdx((prev) => (prev + 1) % images.length); };
            const prevImage = () => { if(!selectedRoomId) return; const images = siteConfig.roomImages[selectedRoomId] || []; setCurrentImgIdx((prev) => (prev - 1 + images.length) % images.length); };
            
            const confirmRoomSelection = () => {
                const roomId = selectedRoomId; 
                const guests = guestCount; 
                const roomInfo = roomConfig[roomId];
                if (!roomInfo) { alert("พบปัญหาข้อมูลห้องพักไม่สมบูรณ์"); setSelectedRoomId(null); return; }
                
                const searchStr = (roomInfo.type + " " + roomInfo.name).toLowerCase();
                const isSharedZone = roomInfo.type === 'ground' || roomId === 'Z8' || roomId === 'R6528' || searchStr.includes('ลานกาง') || searchStr.includes('ground');
                
                let limit = parseInt(roomInfo.maxCap) || 10;
                
                if (isSharedZone) {
                    let avail = limit;
                    if (availability && availability.roomAvailableCount && availability.roomAvailableCount[roomId] !== undefined) {
                         avail = parseInt(availability.roomAvailableCount[roomId]);
                    } else if (availability) {
                         avail = availability.tentAvailable && availability.tentAvailable[roomId] !== undefined ? parseInt(availability.tentAvailable[roomId]) : parseInt(availability.zone8Available || limit);
                    }
                    const currentInCart = cart.filter(c => c.id === roomId).reduce((sum, c) => sum + parseInt(c.guests || 1), 0);
                    limit = Math.max(0, avail - currentInCart);
                }
                
                if (isSharedZone && guests > limit) {
                    setModalAlert({ show: true, type: 'warning', title: t('quotaFullTitle'), text: t('quotaFullDesc', { limit: limit }) });
                    return;
                }
                
                let price = 0; 
                const pricingInfo = typeof roomInfo.pricing === 'string' ? safeJsonParse(roomInfo.pricing, {}) : (roomInfo.pricing || {});
                const isPerHead = isSharedZone || pricingInfo.priceHead !== undefined;
                
                if (isPerHead) { 
                    price = Number(pricingInfo.priceHead || (pricingInfo.tiers && pricingInfo.tiers.length > 0 ? pricingInfo.tiers[0].price : 150)); 
                } else { 
                    const tiers = pricingInfo.tiers || [];
                    if (tiers.length > 0) {
                        const tier = tiers.find(t => guests <= t.max); 
                        if (!tier) { const maxTier = tiers[tiers.length - 1]; price = Number(maxTier ? maxTier.price : 0); } 
                        else { price = Number(tier.price); } 
                    }
                }
                
                setCart([...cart, { id: roomId, name: roomInfo.name, type: roomInfo.type, guests: guests, pricePerNight: price, nights: calculateNights(), isPerHead }]); 
                setSelectedRoomId(null);
            };

            const checkDiscountCode = () => { 
                if(!discount.code) return; setCheckingDiscount(true); 
                fetchWithTimeout(`${GOOGLE_SCRIPT_URL}?action=checkDiscount&code=${discount.code}`).then(r=>r.json()).then(d => { setCheckingDiscount(false); if(d.status === 'success') setDiscount({...discount, val: Number(d.value), type: d.type, message: `ใช้โค้ดสำเร็จ ลด ${d.value} ${d.type==='PERCENT'?'%':'บาท'}`, status: 'success'}); else setDiscount({...discount, val: 0, type: '', message: 'ไม่พบโค้ดส่วนลดนี้', status: 'error'}); }).catch(e => { setCheckingDiscount(false); setDiscount({...discount, val: 0, type: '', message: e.name === 'AbortError' ? 'เน็ตหมดเวลา' : 'เกิดข้อผิดพลาด', status: 'error'}); }); 
            };

            const handleSubmit = () => {
                if (!canSubmit) return; setLoading(true);
                const payload = { action: 'saveBooking', customer, checkIn: dates.checkIn, checkOut: dates.checkOut, totalGuests: cart.filter(c => c.type !== 'food').reduce((s, c) => s + parseInt(c.guests || 1), 0), cart, pricing, discountCode: discount.code, slipImage: slipImg };
                fetchWithTimeout(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json()).then(res => { if (res.status === 'success') { setBookingResult(res.bookingId); setStep(5); } else { alert('Error: ' + res.message); } setLoading(false); }).catch(e => { setLoading(false); alert(e.name === 'AbortError' ? (lang==='en'?'Connection timeout':'การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองอีกครั้งครับ') : 'Failed: ' + e); });
            };
            
            const selectBookingToManage = (booking, tab = 'info') => { setManageData(booking); setManageForm({ bookingId: booking.id, phone: booking.phone }); setManageTab(tab); }
            
            const handleCustomerReschedule = () => {
                if(!rescheduleDates.checkIn || !rescheduleDates.checkOut) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Please select both new dates.' : 'กรุณาเลือกวันเข้าพักและวันออกใหม่' });
                if(rescheduleDates.checkIn < getTommorow()) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Cannot select past or current date.' : 'ไม่สามารถเลือกวันที่ปัจจุบันหรือย้อนหลังได้' });
                if(rescheduleDates.checkIn >= rescheduleDates.checkOut) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Check-out must be after check-in.' : 'วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน' });
                const today = new Date(); today.setHours(0,0,0,0);
                const currentCheckIn = new Date(manageData.checkIn); currentCheckIn.setHours(0,0,0,0);
                const diffTime = currentCheckIn.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 3600 * 24));
                if (diffDays < 7) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? `Must reschedule at least 7 days in advance (${diffDays} days left)` : `ต้องทำการเลื่อนล่วงหน้าอย่างน้อย 7 วัน (เหลืออีก ${diffDays} วัน)` });

                setModalConfirm({ show: true, title: lang === 'en' ? 'Confirm Reschedule' : 'ยืนยันการเลื่อนวัน', text: `${lang==='en'?'Change to:':'เปลี่ยนเป็น'}\n${formatDateLocalized(rescheduleDates.checkIn)} - ${formatDateLocalized(rescheduleDates.checkOut)}`, onConfirm: () => { setModalConfirm({ ...modalConfirm, show: false }); executeReschedule(); } });
            };

            const executeReschedule = () => {
                setLoading(true);
                fetchWithTimeout(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'customerReschedule', bookingId: manageData.id, phone: manageData.phone, newCheckIn: rescheduleDates.checkIn, newCheckOut: rescheduleDates.checkOut }) })
                .then(r => r.json()).then(res => { setLoading(false); if(res.status === 'success') { setModalAlert({ show: true, type: 'success', title: t('success'), text: t('rescheduleSuccess') }); setManageData(null); setMode('booking'); } else { setModalAlert({ show: true, type: 'error', title: t('error'), text: res.message }); } }).catch(e => { setLoading(false); setModalAlert({ show: true, type: 'error', title: 'Error', text: e.name === 'AbortError' ? 'Timeout' : String(e) }); });
            };

            const handleCustomerAddFood = () => {
                if(addOnCart.length === 0) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Please select food items.' : 'กรุณาเลือกอาหาร' });
                if(!addOnSlip) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Please upload slip.' : 'กรุณาแนบสลิป' });
                const today = new Date(); today.setHours(0,0,0,0);
                const currentCheckIn = new Date(manageData.checkIn); currentCheckIn.setHours(0,0,0,0);
                const diffTime = currentCheckIn.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 3600 * 24));
                if (diffDays < 2) return setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Must order at least 2 days in advance.' : 'ต้องสั่งอาหารล่วงหน้าอย่างน้อย 2 วันก่อนเข้าพัก' });
                setModalConfirm({ show: true, title: lang === 'en' ? 'Confirm Order' : 'ยืนยันการสั่งอาหาร', text: `${lang==='en'?'Items:':'รายการ:'}\n${addOnCart.map(i => '- '+ tData(i.name)).join('\n')}`, onConfirm: () => { setModalConfirm({ ...modalConfirm, show: false }); executeAddFood(); } });
            };

            const executeAddFood = () => {
                setLoading(true);
                fetchWithTimeout(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'customerAddFood', bookingId: manageData.id, phone: manageData.phone, newFoodItems: addOnCart, slipImage: addOnSlip }) })
                .then(r => r.json()).then(res => { setLoading(false); if(res.status === 'success') { setModalAlert({ show: true, type: 'success', title: t('success'), text: t('orderFoodSuccess') }); setManageData(null); setAddOnCart([]); setAddOnSlip(null); setMode('booking'); } else { setModalAlert({ show: true, type: 'error', title: t('error'), text: res.message }); } }).catch(e => { setLoading(false); setModalAlert({ show: true, type: 'error', title: 'Error', text: e.name === 'AbortError' ? 'Timeout' : String(e) }); });
            };

            return (
                <div className={isDark ? "dark" : ""}>
                    <div className="min-h-screen bg-[#f3f4f6] dark:bg-gray-900 pb-10 text-gray-800 dark:text-gray-100 transition-colors duration-300 relative">
                        
                        {/* FLOATING ACTION BUTTONS (Top-Right Stack) */}
                        <div className="fixed top-4 right-4 z-50 flex flex-col gap-3">
                            
                            <button onClick={toggleLanguage} className="bg-white dark:bg-gray-700 p-2 rounded-full shadow-lg border border-gray-200 dark:border-gray-600 w-12 h-12 flex flex-col items-center justify-center transition-transform hover:scale-110 text-blue-600 dark:text-blue-400">
                                <i className="fas fa-globe text-sm mb-0.5"></i>
                                <span className="text-[10px] font-bold leading-none">{lang === 'th' ? 'EN' : 'TH'}</span>
                            </button>

                            <button onClick={() => setIsDark(!isDark)} className="bg-white dark:bg-gray-700 p-2 rounded-full shadow-lg border border-gray-200 dark:border-gray-600 w-12 h-12 flex items-center justify-center transition-transform hover:scale-110 text-gray-800 dark:text-white"> 
                                {isDark ? '☀️' : '🌙'} 
                            </button>
                            
                            <button onClick={() => { setMode(mode === 'booking' ? 'manage' : 'booking'); setStep(1); setManageData(null); setManageTab('info'); }} className="bg-white dark:bg-gray-700 p-2 rounded-full shadow-lg border border-gray-200 dark:border-gray-600 w-12 h-12 flex items-center justify-center transition-transform hover:scale-110 text-gray-800 dark:text-white"> 
                                {mode === 'booking' ? <i className="fas fa-search"></i> : <i className="fas fa-home"></i>} 
                            </button>

                        </div>

                        {/* --- MANAGE MODE --- */}
                        {mode === 'manage' && (
                            <div className="max-w-md mx-auto p-4 sm:pt-8">
                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 min-h-[500px]">
                                    <h2 className="text-xl font-bold mb-4 text-center text-blue-600 dark:text-blue-400">{t('manageTitle')}</h2>
                                    
                                    {!manageData ? (
                                        <div className="animate-pop">
                                            {loading ? (
                                                <div className="flex flex-col items-center justify-center py-10">
                                                    <i className="fas fa-campground text-5xl text-green-600 animate-bounce mb-4"></i>
                                                    <p className="text-gray-500 dark:text-gray-400 font-bold">{t('loadingData')}</p>
                                                </div>
                                            ) : (
                                                !isLiffReady ? (
                                                    <div className="text-center py-10">
                                                        <p className="text-gray-500">{t('connectingLine')}</p>
                                                    </div>
                                                ) : (
                                                    !customer.userId ? (
                                                        <div className="text-center py-10">
                                                            <div className="text-4xl mb-4">⚠️</div>
                                                            <p className="text-gray-500">{t('noLineUser')}</p>
                                                            <p className="text-xs text-gray-400 mt-2">{t('noLineUserDesc')}</p>
                                                            <button onClick={() => liff.login({ redirectUri: window.location.href })} className="mt-4 bg-green-500 text-white px-6 py-2 rounded-full font-bold shadow hover:bg-green-600 transition">{t('loginLine')}</button>
                                                        </div>
                                                    ) : (
                                                        bookingList.length > 0 ? (
                                                            <div className="space-y-4 animate-pop">
                                                                <p className="text-sm text-gray-500 text-center mb-4">{t('foundBookings', { count: bookingList.length })}</p>
                                                                {bookingList.map(b => {
                                                                    const isPast = isBookingPast(b.checkOut);
                                                                    return (
                                                                        <div key={b.id} className="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
                                                                            <div onClick={() => selectBookingToManage(b, 'info')} className="p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                                                                                <div className="flex justify-between items-start mb-2">
                                                                                     <span className="font-bold text-blue-600 dark:text-blue-400 text-lg">{b.id}</span>
                                                                                     <span className={`text-xs px-2 py-1 rounded-full font-bold ${isPast ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-800'}`}>{isPast ? t('statusPast') : b.status}</span>
                                                                                </div>
                                                                                <div className="text-sm text-gray-600 dark:text-gray-300 space-y-1">
                                                                                    <div className="flex items-center"><i className="fas fa-calendar-day w-5 text-center mr-2 text-gray-400"></i> {formatDateLocalized(b.checkIn)}</div>
                                                                                    <div className="flex items-center"><i className="fas fa-home w-5 text-center mr-2 text-gray-400"></i> {tDataList(b.rooms)}</div>
                                                                                </div>
                                                                            </div>
                                                                            {!isPast ? (
                                                                                <div className="flex border-t border-gray-100 dark:border-gray-600 divide-x divide-gray-100 dark:divide-gray-600 bg-gray-50 dark:bg-gray-800">
                                                                                    <button onClick={() => selectBookingToManage(b, 'reschedule')} className="flex-1 py-3 text-sm font-bold text-orange-600 hover:bg-orange-50 dark:hover:bg-gray-700 transition flex items-center justify-center gap-2">
                                                                                        <i className="fas fa-calendar-alt"></i> {t('btnReschedule')}
                                                                                    </button>
                                                                                    <button onClick={() => selectBookingToManage(b, 'food')} className="flex-1 py-3 text-sm font-bold text-green-600 hover:bg-green-50 dark:hover:bg-gray-700 transition flex items-center justify-center gap-2">
                                                                                        <i className="fas fa-utensils"></i> {t('btnOrderFood')}
                                                                                    </button>
                                                                                </div>
                                                                            ) : (
                                                                                <div className="bg-gray-50 dark:bg-gray-800 p-3 text-center text-xs text-gray-400 border-t border-gray-100 dark:border-gray-600">
                                                                                    <i className="fas fa-check-circle mr-1"></i> {t('checkedOut')}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        ) : (
                                                            <div className="text-center py-10 animate-pop">
                                                                <div className="text-6xl mb-4">🔍</div>
                                                                <p className="text-gray-500">{t('noBookings')}</p>
                                                                <p className="text-xs text-gray-400 mt-2">{t('noBookingsDesc')}</p>
                                                                <button onClick={() => window.location.reload()} className="mt-4 text-blue-600 text-sm underline">{t('tryAgain')}</button>
                                                            </div>
                                                        )
                                                    )
                                                )
                                            )}
                                        </div>
                                    ) : (
                                        <div className="animate-pop">
                                            <div className="flex items-center mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">
                                                <button onClick={() => setManageData(null)} className="mr-3 text-gray-500 hover:text-blue-600 p-1"><i className="fas fa-arrow-left text-lg"></i></button>
                                                <span className="font-bold text-gray-700 dark:text-gray-200">ID: {manageData.id}</span>
                                            </div>
                                            {(() => {
                                                const isPast = isBookingPast(manageData.checkOut);
                                                return !isPast ? (
                                                    <div className="flex border-b border-gray-200 dark:border-gray-700 mb-4">
                                                        <button onClick={() => setManageTab('info')} className={`flex-1 py-2 text-sm font-bold ${manageTab === 'info' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'}`}>{t('tabInfo')}</button>
                                                        <button onClick={() => setManageTab('reschedule')} className={`flex-1 py-2 text-sm font-bold ${manageTab === 'reschedule' ? 'text-orange-600 border-b-2 border-orange-600' : 'text-gray-500'}`}>{t('tabReschedule')}</button>
                                                        <button onClick={() => setManageTab('food')} className={`flex-1 py-2 text-sm font-bold ${manageTab === 'food' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-500'}`}>{t('tabFood')}</button>
                                                    </div>
                                                ) : null;
                                            })()}

                                            {manageTab === 'info' && (
                                                <div className="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 p-4 rounded-lg mb-6 animate-pop">
                                                    <div className="text-center mb-2"><span className="bg-blue-600 text-white px-2 py-1 rounded text-xs">{manageData.status}</span></div>
                                                    <h3 className="text-lg font-bold text-center mb-4 text-gray-800 dark:text-white">{manageData.name}</h3>
                                                    <div className="text-sm space-y-2 text-gray-700 dark:text-gray-300">
                                                        <div className="flex justify-between"><span>{t('checkIn')}</span> <b>{formatDateLocalized(manageData.checkIn)}</b></div>
                                                        <div className="flex justify-between"><span>{t('checkOut')}</span> <b>{formatDateLocalized(manageData.checkOut)}</b></div>
                                                        <div className="flex justify-between"><span>{t('guestsCount')}</span> <b>{manageData.guests} {t('persons')}</b></div>
                                                        <div className="flex justify-between"><span>{t('roomsList')}</span> <span className="text-right whitespace-pre-line">{tDataList(manageData.rooms)}</span></div>
                                                    </div>
                                                    <div className="mt-4 pt-4 border-t border-blue-200 dark:border-blue-700">
                                                        <h4 className="font-bold text-sm text-blue-800 dark:text-blue-300 mb-2">{t('orderedFood')}</h4>
                                                        <p className="text-sm text-gray-600 dark:text-gray-300 whitespace-pre-line">{tDataList(manageData.food)}</p>
                                                    </div>
                                                </div>
                                            )}

                                            {manageTab === 'reschedule' && (
                                                <div className="space-y-3 animate-pop">
                                                    <div className="bg-yellow-50 dark:bg-yellow-900/20 text-xs p-2 rounded mb-4 text-yellow-800 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-800">
                                                        {t('rescheduleRule')}
                                                    </div>
                                                    <div><label className="block text-xs font-bold mb-1 text-gray-700 dark:text-gray-300">{t('newCheckIn')}</label><input type="date" min={getTommorow()} className="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" onChange={e => setRescheduleDates({...rescheduleDates, checkIn: e.target.value})} /></div>
                                                    <div><label className="block text-xs font-bold mb-1 text-gray-700 dark:text-gray-300">{t('newCheckOut')}</label><input type="date" min={rescheduleDates.checkIn || getTommorow()} className="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" onChange={e => setRescheduleDates({...rescheduleDates, checkOut: e.target.value})} /></div>
                                                    <button onClick={handleCustomerReschedule} disabled={loading} className="w-full bg-orange-600 text-white py-3 rounded-lg font-bold shadow hover:bg-orange-700 transition mt-4">{loading ? t('working') : t('confirmRescheduleBtn')}</button>
                                                </div>
                                            )}

                                            {manageTab === 'food' && (
                                                <div className="space-y-4 animate-pop">
                                                    <div className="bg-green-50 dark:bg-green-900/20 text-xs p-2 rounded mb-4 text-green-800 dark:text-green-200 border border-green-200 dark:border-green-800">{t('foodOrderRule')}</div>
                                                    <div className="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto custom-scrollbar">
                                                        {siteConfig.foodMenu.map(f => {
                                                            const inCart = addOnCart.find(c => c.id === f.id);
                                                            return (
                                                                <div key={f.id} onClick={() => {
                                                                    const today = new Date(); today.setHours(0,0,0,0);
                                                                    const currentCheckIn = new Date(manageData.checkIn); currentCheckIn.setHours(0,0,0,0);
                                                                    const diffTime = currentCheckIn.getTime() - today.getTime();
                                                                    const diffDays = Math.ceil(diffTime / (1000 * 3600 * 24));
                                                                    if (diffDays < 2) {
                                                                        setModalAlert({ show: true, type: 'warning', title: t('notice'), text: lang === 'en' ? 'Must order at least 2 days in advance.' : 'ต้องสั่งอาหารล่วงหน้าอย่างน้อย 2 วันก่อนเข้าพัก' });
                                                                        return;
                                                                    }
                                                                    openFoodModal(f);
                                                                }} className={`cursor-pointer rounded-lg overflow-hidden border-2 transition-all shadow-sm relative ${inCart ? 'border-green-500 bg-green-50 dark:bg-green-900 dark:border-green-500' : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-700'}`}>
                                                                    <img src={f.img} className="w-full h-20 object-cover" />
                                                                    <div className="p-1"><h4 className="font-bold text-xs line-clamp-1">{tData(f.name)}</h4><div className="flex justify-between items-center mt-1"><span className="text-green-600 text-xs font-bold">{f.price}.-</span>{inCart && <span className="bg-green-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">x{inCart.qty}</span>}</div></div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                    {addOnCart.length > 0 && (
                                                        <div className="bg-gray-100 dark:bg-gray-700 p-3 rounded mb-4">
                                                            <h4 className="font-bold text-xs mb-2">{t('selectedItems', { count: addOnCart.length })}</h4>
                                                            {addOnCart.map((c,i)=><div key={i} className="flex justify-between text-xs mt-1"><span>{tData(c.name)} x{c.qty}</span><button onClick={()=>setAddOnCart(addOnCart.filter((_,idx)=>idx!==i))} className="text-red-500">{t('delete')}</button></div>)}
                                                            <div className="mt-2 pt-2 border-t text-right font-bold text-sm text-green-600 mb-2">{t('total')} {formatMoney(addOnCart.reduce((sum,c)=>sum+(c.price*c.qty),0))} ฿</div>
                                                            <div className="bg-white dark:bg-gray-800 p-3 rounded border border-gray-200 dark:border-gray-600">
                                                                <p className="text-xs font-bold mb-2 text-center">{t('scanToOrder')}</p>
                                                                {addOnQr && (
                                                                    <div className="flex flex-col items-center mb-3">
                                                                        <img src={addOnQr} className="mx-auto border-2 border-gray-200 dark:border-gray-600 rounded-xl mb-3 shadow-sm p-2 bg-white" alt="QR Code" style={{ width: '150px', height: '150px' }} />
                                                                        <a href={addOnQr} download={`qr-food-${manageData.id}.png`} className="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2 shadow-sm">
                                                                            <i className="fas fa-download"></i> {t('saveQrBtn')}
                                                                        </a>
                                                                    </div>

                                        if (f) { 
                                            try { 
                                                setSlipStatus({ type: 'loading', msg: lang === 'en' ? 'Checking slip...' : 'กำลังตรวจสอบสลิป...' });
                                                const resizedBase64 = await compressImage(f); 
                                                setSlipImg(resizedBase64); 
                                                
                                                // Client-Side Slip Verification
                                                checkSlipQR(resizedBase64, PROMPTPAY_PHONE, (res) => {
                                                    setSlipStatus(res);
                                                });
                                            } catch (err) { alert('Upload error'); } 
                                        } 
                                    }} className="w-full text-sm dark:text-gray-300" /> 
                                    
                                    {/* สถานะเช็คสลิป */}
                                    {slipStatus && slipStatus.type !== 'loading' && (
                                        <p className={`text-[10px] mt-2 p-1.5 rounded ${slipStatus.type === 'success' ? 'bg-green-100 text-green-700' : slipStatus.type === 'error' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                            {t(slipStatus.msg)}
                                        </p>
                                    )}
                                    {slipStatus && slipStatus.type === 'loading' && (
                                        <p className="text-[10px] mt-2 p-1.5 rounded bg-blue-100 text-blue-700">
                                            <i className="fas fa-spinner fa-spin mr-1"></i> {slipStatus.msg}
                                        </p>
                                    )}
                                </div>

                                <div className="flex items-start gap-2 mb-4 text-xs text-gray-600 dark:text-gray-400"> <input type="checkbox" className="mt-1" checked={agreed} onChange={e => setAgreed(e.target.checked)} /> <p>{t('agreeTerms')}</p> </div>
                                <button onClick={handleSubmit} disabled={loading || !canSubmit} className={`w-full p-3 rounded-lg font-bold text-white transition ${loading || !canSubmit ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 shadow-lg'}`}>{loading ? t('confirmingBtn') : t('confirmBookingBtn')}</button>
                            </div>
                        )}

                        {mode === 'booking' && step === 5 && (
                            <div className="max-w-md mx-auto p-8 pt-16 text-center bg-white dark:bg-gray-800 shadow-xl rounded-xl">
                                <div className="w-20 h-20 bg-green-100 dark:bg-green-900 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500 text-4xl shadow-inner animate-pop"><i className="fas fa-check"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-2">{t('bookingSuccessTitle')}</h2>
                                <p className="text-gray-600 dark:text-gray-300 mb-6">{t('bookingIdText')} <span className="font-bold text-green-600">{bookingResult}</span></p>
                                <div className="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg text-sm text-gray-700 dark:text-gray-300 mb-6 whitespace-pre-line">
                                    {t('successMessage')}
                                </div>
                                <button onClick={() => window.location.reload()} className="w-full bg-gray-800 dark:bg-gray-600 text-white p-3 rounded-lg hover:bg-gray-700 transition font-bold shadow">{t('backToHome')}</button>
                            </div>
                        )}

                        {/* --- MODALS --- */}
                        {selectedFood && (
                            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
                                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm relative animate-pop overflow-hidden">
                                    <button onClick={() => setSelectedFood(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 z-10 w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm"><i className="fas fa-times text-lg"></i></button>
                                    <div className="w-full h-48 -mt-6 -mx-6 mb-4 relative"><img src={selectedFood.img} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div></div>
                                    <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-1">{tData(selectedFood.name)}</h3>
                                    <p className="text-sm text-gray-500 dark:text-gray-400 mb-4 h-10 overflow-y-auto custom-scrollbar">{tData(selectedFood.desc) || t('noDesc')}</p>
                                    <div className="flex items-center justify-between mb-4 bg-gray-50 dark:bg-gray-700 p-4 rounded-xl border border-gray-100 dark:border-gray-600">
                                        <div className="text-lg font-bold text-green-600 dark:text-green-400">{selectedFood.price} ฿ <span className="text-xs text-gray-500">/ ชุด</span></div>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setFoodCount(Math.max(1, foodCount - 1))} className="w-8 h-8 bg-green-600 hover:bg-green-700 text-white rounded-full shadow-sm font-bold transition-colors">-</button>
                                            <span className="text-lg font-bold w-6 text-center dark:text-white">{foodCount}</span>
                                            <button onClick={() => setFoodCount(foodCount + 1)} className="w-8 h-8 bg-green-600 hover:bg-green-700 text-white rounded-full shadow-sm font-bold transition-colors">+</button>
                                        </div>
                                    </div>
                                    
                                    <div className="mb-4">
                                        <textarea 
                                            className="w-full border border-gray-200 dark:border-gray-600 rounded-lg p-2 text-sm bg-white dark:bg-gray-700 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500 outline-none" 
                                            placeholder={t('foodNotePlaceholder')} 
                                            rows="2"
                                            value={foodNote}
                                            onChange={(e) => setFoodNote(e.target.value)}
                                        ></textarea>
                                    </div>

                                    <button onClick={confirmFoodSelection} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition flex items-center justify-center gap-2"><i className="fas fa-cart-plus"></i> {t('addCart')}</button>
                                </div>
                            </div>
                        )}
                        
                        {showRoomRequiredModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-6">
                                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center relative animate-pop">
                                    <div className="w-16 h-16 bg-yellow-100 dark:bg-yellow-900 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fas fa-campground text-3xl text-yellow-500 dark:text-yellow-300"></i></div>
                                    <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-2">{t('roomRequiredTitle')}</h3>
                                    <p className="text-gray-600 dark:text-gray-300 mb-6 text-sm">{t('roomRequiredDesc')}</p>
                                    <button onClick={() => setShowRoomRequiredModal(false)} className="w-full bg-yellow-500 text-white py-3 rounded-xl font-bold hover:bg-yellow-600 transition shadow">{t('acknowledge')}</button>
                                </div>
                            </div>
                        )}
                        
                        {closedModal && ( <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-6"> <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center relative animate-pop"> <div className="w-16 h-16 bg-red-100 dark:bg-red-900 rounded-full flex items-center justify-center mx-auto mb-4"> <i className="fas fa-ban text-3xl text-red-500 dark:text-red-300"></i> </div> <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-2">วันปิดให้บริการ</h3> <p className="text-gray-600 dark:text-gray-300 mb-1">วันที่ <strong>{formatDateLocalized(closedModal.date)}</strong></p> <p className="text-red-500 dark:text-red-400 font-medium mb-6">"{closedModal.reason}"</p> <button onClick={() => setClosedModal(null)} className="w-full bg-gray-800 dark:bg-gray-600 text-white py-3 rounded-xl font-bold hover:bg-gray-700 transition">เลือกวันใหม่</button> </div> </div> )}
                        
                        {searchError && ( <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-6"> <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center relative animate-pop"> <div className="w-16 h-16 bg-yellow-100 dark:bg-yellow-900 rounded-full flex items-center justify-center mx-auto mb-4"> <i className="fas fa-exclamation-triangle text-3xl text-yellow-500 dark:text-yellow-300"></i> </div> <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-2">{t('notice')}</h3> <p className="text-gray-600 dark:text-gray-300 mb-6 text-sm">{searchError}</p> <button onClick={() => setSearchError(null)} className="w-full bg-yellow-500 text-white py-3 rounded-xl font-bold hover:bg-yellow-600 transition">{t('ok')}</button> </div> </div> )}
                        
                        {modalAlert.show && ( <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm transition-opacity"> <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden animate-pop"> <div className={`p-6 text-center ${modalAlert.type==='error'?'bg-red-50 dark:bg-red-900/20':''}`}> <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${modalAlert.type==='error'?'bg-red-100 text-red-500': modalAlert.type==='success'?'bg-green-100 text-green-500':'bg-yellow-100 text-yellow-500'}`}> <i className={`fas ${modalAlert.type==='error'?'fa-times':modalAlert.type==='success'?'fa-check':'fa-exclamation'} text-2xl`}></i> </div> <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-2">{modalAlert.title}</h3> <p className="text-gray-600 dark:text-gray-300 text-sm whitespace-pre-wrap">{modalAlert.text}</p> </div> <div className="p-4 bg-gray-50 dark:bg-gray-700"> <button onClick={() => setModalAlert({ ...modalAlert, show: false })} className="w-full py-2.5 bg-gray-800 dark:bg-gray-600 text-white rounded-xl font-bold hover:bg-gray-700 transition">{t('ok')}</button> </div> </div> </div> )}
                        
                        {modalConfirm.show && ( <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm transition-opacity"> <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden animate-pop"> <div className="p-6 text-center"> <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500"> <i className="fas fa-question text-3xl"></i> </div> <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-2">{modalConfirm.title}</h3> <p className="text-gray-600 dark:text-gray-300 text-sm whitespace-pre-wrap">{modalConfirm.text}</p> </div> <div className="p-4 bg-gray-50 dark:bg-gray-700 flex gap-2"> <button onClick={() => setModalConfirm({ ...modalConfirm, show: false })} className="flex-1 py-2.5 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 text-gray-700 dark:text-gray-200 rounded-xl font-bold hover:bg-gray-50 transition">{t('cancel')}</button> <button onClick={modalConfirm.onConfirm} className="flex-1 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition shadow">{t('confirm')}</button> </div> </div> </div> )}

                        {/* --- CAMPING LOADING OVERLAY --- */}
                        {(loading || isInitializing) && <CampingLoaderOverlay text={isInitializing ? t('loadingPrepare') : t('loadingWait')} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
