<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขนำลุงดำ แคมป์ปิ้ง - จองที่พัก</title>
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    
    <!-- Core Libraries (ไม่ใช้ Babel) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; }
        .map-container { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: fadeIn 0.3s ease-out forwards; }
        .map-pin-responsive { transition: transform 0.2s; }
        @media (max-width: 640px) { .map-pin-responsive { transform: translate(-50%, -50%) scale(0.8) !important; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#f3f4f6] dark:bg-gray-900">
    <div id="root">
        <!-- Skeleton UI แสดงผลทันทีขณะรอสคริปต์ทำงาน -->
        <div class="max-w-md mx-auto p-4 pt-10 text-center">
            <div class="w-28 h-28 bg-gray-200 dark:bg-gray-700 rounded-full mx-auto animate-pulse mb-4"></div>
            <div class="h-6 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mx-auto animate-pulse mb-3"></div>
            <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mx-auto animate-pulse mb-8"></div>
            <div class="h-12 bg-green-200 dark:bg-green-900 rounded-lg w-full animate-pulse"></div>
        </div>
    </div>

    <!-- โหลด Pure JS สคริปต์ความเร็วสูง -->
    <script src="js/app.js" defer></script>
</body>
</html>
